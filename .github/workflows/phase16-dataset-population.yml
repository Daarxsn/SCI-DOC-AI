name: Phase 16 - Dataset Population Verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest -q tests/test_p16_dataset_population.py
      - run: python -m py_compile scripts/intake_phase16_case.py scripts/validate_phase16_case.py scripts/verify_phase16_dataset.py
