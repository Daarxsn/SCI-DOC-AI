name: Phase 10 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-release:
    name: Production Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Verify release package
        run: python scripts/verify_phase10.py
      - name: Verify release manifest syntax
        run: python -m json.tool release-manifest.json > /dev/null