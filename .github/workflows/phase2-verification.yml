name: Phase 2 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-phase2:
    name: Golden Dataset + Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2,<3" pytest

      - name: Verify Phase 2
        run: python scripts/verify_phase2.py
