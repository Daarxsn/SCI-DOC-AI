name: Phase 3 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-phase3:
    name: Real E2E Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2,<3" "pydantic-settings>=2,<3" pytest pillow reportlab pymupdf
      - name: Verify Phase 3
        run: python scripts/verify_phase3.py
