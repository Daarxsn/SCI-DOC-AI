name: Phase 15 - Golden Dataset Verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest -q tests/test_p15_dataset_contract.py
      - run: python scripts/verify_phase15_dataset.py
