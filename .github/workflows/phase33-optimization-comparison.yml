name: Phase 33 - Optimization Comparison
on:
  push:
    branches: [main]
    paths:
      - "backend/evaluation/phase33.py"
      - "scripts/run_phase33_comparison.py"
      - "tests/test_p33_optimization_comparison.py"
      - "docs/PHASE33_OPTIMIZATION_COMPARISON.md"
      - ".github/workflows/phase33-optimization-comparison.yml"
  workflow_dispatch:
jobs:
  phase33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest -q tests/test_p33_optimization_comparison.py
      - run: python -m py_compile backend/evaluation/phase33.py scripts/run_phase33_comparison.py
      - run: test -f docs/PHASE33_OPTIMIZATION_COMPARISON.md
