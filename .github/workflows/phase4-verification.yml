name: Phase 4 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-phase4:
    name: Production Reconstruction
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reconstruction test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verify Phase 4
        run: python scripts/verify_phase4.py
