name: Frontend Phase 10 - Production Release Readiness

on:
  push:
    paths:
      - "frontend/**"
      - "README.md"
      - "docs/FRONTEND_PHASE10_RELEASE_READINESS.md"
      - ".github/workflows/frontend-phase10.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "README.md"
      - "docs/FRONTEND_PHASE10_RELEASE_READINESS.md"
      - ".github/workflows/frontend-phase10.yml"

jobs:
  release-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run verify:release
