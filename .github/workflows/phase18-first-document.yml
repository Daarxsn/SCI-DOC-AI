name: Phase 18 - First Document Processing Gate
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  phase18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest -q tests/test_p18_execution_gate.py
      - run: python -m py_compile backend/evaluation/phase18.py scripts/run_phase18_case.py
      - run: test -f datasets/golden/phase17-first-case.manifest.json
