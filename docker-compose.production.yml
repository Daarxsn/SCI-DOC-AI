services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: SCI-DOC AI
      API_VERSION: v1
      DEBUG: "false"
      SCI_DOC_API_KEY: ${SCI_DOC_API_KEY:?SCI_DOC_API_KEY is required}
      SCI_DOC_TENANT_ID: ${SCI_DOC_TENANT_ID:?SCI_DOC_TENANT_ID is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s