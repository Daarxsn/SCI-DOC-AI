name: Frontend Phase 05 - Job Lifecycle

on:
  push:
    paths:
      - "frontend/**"
      - "docs/FRONTEND_PHASE05_JOB_LIFECYCLE.md"
      - ".github/workflows/frontend-phase05.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/FRONTEND_PHASE05_JOB_LIFECYCLE.md"
      - ".github/workflows/frontend-phase05.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
