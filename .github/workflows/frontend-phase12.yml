name: Frontend Phase 12 - Security Hardening

on:
  push:
    paths:
      - "frontend/**"
      - "docs/FRONTEND_PHASE12_SECURITY_HARDENING.md"
      - ".github/workflows/frontend-phase12.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/FRONTEND_PHASE12_SECURITY_HARDENING.md"
      - ".github/workflows/frontend-phase12.yml"

jobs:
  security-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run verify:release
