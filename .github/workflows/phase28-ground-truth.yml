name: Phase 28 - Ground Truth Annotation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  phase28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest -q tests/test_p28_ground_truth.py
      - run: python -m py_compile backend/evaluation/phase28.py scripts/run_phase28_ground_truth.py
      - run: test -f docs/PHASE28_GROUND_TRUTH_ANNOTATION.md
