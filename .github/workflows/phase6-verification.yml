name: Phase 6 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-phase6:
    name: Benchmark + Optimization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Verify Phase 6
        run: python scripts/verify_phase6.py
      - name: Verify provenance
        run: python -m pytest tests/test_evaluation_provenance.py tests/test_optimization.py -q
