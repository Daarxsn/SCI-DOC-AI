name: Phase 7 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-phase7:
    name: Enterprise Hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Verify Phase 7
        run: python scripts/verify_phase7.py