name: Frontend Phase 17 - E2E Smoke Verification

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/phase17-smoke.sh"
      - "docker-compose.yml"
      - "docs/FRONTEND_PHASE17_E2E_SMOKE.md"
      - ".github/workflows/frontend-phase17.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/phase17-smoke.sh"
      - "docker-compose.yml"
      - "docs/FRONTEND_PHASE17_E2E_SMOKE.md"
      - ".github/workflows/frontend-phase17.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SCI_DOC_API_KEY: phase17-ci-local-key
      SCI_DOC_TENANT_ID: phase17-ci-tenant
      SCI_DOC_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - name: Start API
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready >/tmp/ready.json 2>/dev/null; then
              cat /tmp/ready.json
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/ready
      - name: Run Phase 17 smoke
        run: bash scripts/phase17-smoke.sh
      - name: API logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop API
        if: always()
        run: docker compose down -v
